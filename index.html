<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EventLive – Live Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      margin: 0;
      background: #020617;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h2 {
      margin-top: 16px;
    }
    .status {
      margin-top: 6px;
      color: #22c55e;
      font-size: 14px;
    }
    video {
      width: 100%;
      max-width: 720px;
      margin-top: 16px;
      background: black;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h2>🔴 LIVE EVENT</h2>
<div class="status" id="status">Connecting…</div>
<video id="remoteVideo" autoplay playsinline></video>

<!-- ✅ Firebase COMPAT SDKs (IMPORTANT) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* 🔥 FIREBASE CONFIG (PASTE YOUR REAL VALUES) */
const firebaseConfig = {
  apiKey: "AIzaSyCTJLIJjgKTrjBUMFQUw1-_W_2wtJGMKc",
  authDomain: "eventlive-webrtc.firebaseapp.com",
  databaseURL: "https://eventlive-webrtc-default-rtdb.firebaseio.com",
  projectId: "eventlive-webrtc",
  storageBucket: "eventlive-webrtc.firebasestorage.app",
  messagingSenderId: "779925983608",
  appId: "1:779925983608:web:d00b76dd38d69b04dc788d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ---------------- EVENT ID ---------------- */

const params = new URLSearchParams(window.location.search);
const eventId = params.get("id");

if (!eventId) {
  document.getElementById("status").innerText = "No Event ID found";
  throw new Error("Missing event ID");
}

document.getElementById("status").innerText =
  "Waiting for host (Event ID: " + eventId + ")";

/* ---------------- WEBRTC ---------------- */

const pc = new RTCPeerConnection({
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
});

const video = document.getElementById("remoteVideo");

pc.ontrack = (event) => {
  video.srcObject = event.streams[0];
  document.getElementById("status").innerText = "Live stream connected";
};

/* ---------------- SEND ICE (VIEWER → ANDROID) ---------------- */

pc.onicecandidate = (event) => {
  if (event.candidate) {
    db.ref(`events/${eventId}/viewerCandidates`)
      .push(event.candidate.toJSON());
  }
};

/* ---------------- RECEIVE OFFER (ANDROID → WEB) ---------------- */

db.ref(`events/${eventId}/offer`).on("value", async (snapshot) => {
  if (!snapshot.exists()) return;

  const offer = snapshot.val();
  await pc.setRemoteDescription(new RTCSessionDescription(offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await db.ref(`events/${eventId}/answer`).set(answer);
});

/* ---------------- RECEIVE ICE (ANDROID → WEB) ---------------- */

db.ref(`events/${eventId}/hostCandidates`)
  .on("child_added", (snapshot) => {
    const candidate = snapshot.val();
    if (candidate) {
      pc.addIceCandidate(new RTCIceCandidate(candidate));
    }
  });
</script>

</body>
</html>
