<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>EventLive Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .live {
      color: red;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .box {
      border: 1px solid #334155;
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      max-width: 400px;
    }
  </style>
</head>

<body>

  <h1>EventLive</h1>
  <div class="live">🔴 LIVE EVENT</div>

  <div class="box">
    <h3>Event ID</h3>
    <p id="eventId">Loading...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("id");
    document.getElementById("eventId").innerText =
      eventId ? eventId : "No Event ID Found";
  </script>

</body>
</html>
